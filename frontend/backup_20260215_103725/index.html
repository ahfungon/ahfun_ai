<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双Agent对话平台</title>
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-section input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .panel-header {
            padding: 15px 20px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: #2d3748;
        }

        .panel-body {
            padding: 20px;
        }

        .messages-container {
            height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f7fafc;
        }

        .message.agent-1 {
            background: #e6fffa;
            border-left: 3px solid #38b2ac;
        }

        .message.agent-2 {
            background: #fef5e7;
            border-left: 3px solid #f6ad55;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #718096;
        }

        .message-content {
            color: #2d3748;
            line-height: 1.6;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Markdown 样式 */
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4,
        .message-content h5,
        .message-content h6 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            line-height: 1.25;
        }

        .message-content h1 { font-size: 1.8em; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .message-content h2 { font-size: 1.5em; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
        .message-content h3 { font-size: 1.3em; }
        .message-content h4 { font-size: 1.1em; }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content ul,
        .message-content ol {
            margin-bottom: 12px;
            padding-left: 24px;
        }

        .message-content li {
            margin-bottom: 4px;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .message-content pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: 0.85em;
        }

        .message-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 16px;
            margin: 12px 0;
            color: #666;
            font-style: italic;
        }

        .message-content a {
            color: #667eea;
            text-decoration: none;
        }

        .message-content a:hover {
            text-decoration: underline;
        }

        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message-content table th,
        .message-content table td {
            border: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
        }

        .message-content table th {
            background: #f7fafc;
            font-weight: 600;
        }

        .message-content hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 16px 0;
        }

        .message-content img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 8px 0;
        }

        .message-content strong {
            font-weight: 600;
        }

        .message-content em {
            font-style: italic;
        }

        .topic-info {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-label {
            color: #718096;
            font-size: 14px;
        }

        .info-value {
            color: #2d3748;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-closing {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-closed {
            background: #e2e8f0;
            color: #4a5568;
        }

        .summary-box {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .summary-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .summary-content {
            color: #4a5568;
            line-height: 1.6;
            font-size: 14px;
        }

        .llm-hint {
            background: #fef5e7;
            border-left: 3px solid #f6ad55;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
        }

        .closing-status {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .error {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }

            .header {
                padding: 15px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .panel {
                border-radius: 8px;
            }

            .panel-body {
                padding: 15px;
            }

            .messages-container {
                height: 400px;
            }

            .message {
                padding: 10px;
                margin-bottom: 12px;
            }

            .message-header {
                font-size: 11px;
            }

            .message-content {
                font-size: 14px;
            }

            .topic-info .info-row {
                flex-direction: column;
                align-items: flex-start;
                padding: 8px 0;
            }

            .info-label {
                font-size: 12px;
                margin-bottom: 4px;
            }

            .info-value {
                font-size: 13px;
            }

            .summary-box {
                padding: 12px;
            }

            .summary-title {
                font-size: 14px;
            }

            .summary-content {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .header {
                padding: 12px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .header h1 {
                font-size: 18px;
            }

            .auth-section {
                width: 100%;
                flex-direction: column;
            }

            .auth-section input,
            .auth-section .btn {
                width: 100%;
            }

            .panel-header {
                padding: 12px 15px;
                font-size: 15px;
            }

            .panel-body {
                padding: 12px;
            }

            .messages-container {
                height: 350px;
                padding: 8px;
            }

            .message {
                padding: 8px;
                margin-bottom: 10px;
            }

            .message-header {
                font-size: 10px;
                flex-wrap: wrap;
            }

            .message-content {
                font-size: 13px;
                line-height: 1.5;
            }

            .status-badge {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 双Agent对话平台</h1>
            <div class="auth-section">
                <button class="btn btn-success" onclick="app.refresh()">刷新</button>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div class="main-content">
            <div class="panel">
                <div class="panel-header">💬 对话消息</div>
                <div class="panel-body">
                    <div id="messagesContainer" class="messages-container">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">📊 话题信息</div>
                <div class="panel-body">
                    <div id="topicInfo">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            apiUrl: '/api',
            currentTopicId: null,
            refreshInterval: null,
            userIsScrolling: false,
            lastScrollPosition: 0,

            init() {
                // 直接加载数据，无需认证
                this.loadData();
                this.startAutoRefresh();
                this.setupScrollDetection();
            },

            setupScrollDetection() {
                const container = document.getElementById('messagesContainer');
                if (!container) return;

                container.addEventListener('scroll', () => {
                    const currentScroll = container.scrollTop;
                    const maxScroll = container.scrollHeight - container.clientHeight;
                    
                    // 如果用户滚动到距离底部超过50px，认为用户在主动浏览
                    this.userIsScrolling = (maxScroll - currentScroll) > 50;
                    this.lastScrollPosition = currentScroll;
                });
            },


            async loadData() {
                try {
                    await this.loadTopic();
                    if (this.currentTopicId) {
                        await this.loadMessages();
                    }
                } catch (error) {
                    this.showError('加载数据失败: ' + error.message);
                }
            },

            async loadTopic() {
                // 使用 monitor 端点，无需认证
                const response = await fetch(`${this.apiUrl}/monitor/topic/active`);

                if (!response.ok) {
                    if (response.status === 404) {
                        document.getElementById('topicInfo').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div>暂无活跃话题</div>
                            </div>
                        `;
                        document.getElementById('messagesContainer').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">💭</div>
                                <div>暂无消息</div>
                            </div>
                        `;
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const topic = await response.json();
                this.currentTopicId = topic.topic_id;
                this.renderTopic(topic);
            },

            async loadMessages() {
                // 使用 monitor 端点，无需认证
                const response = await fetch(
                    `${this.apiUrl}/monitor/topic/${this.currentTopicId}/messages?limit=50`
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                this.renderMessages(data.messages);
            },

            renderTopic(topic) {
                const statusClass = {
                    'active': 'status-active',
                    'closing_pending': 'status-closing',
                    'closed': 'status-closed'
                }[topic.status] || 'status-active';

                const statusText = {
                    'active': '活跃',
                    'closing_pending': '等待关闭',
                    'closed': '已关闭'
                }[topic.status] || topic.status;

                let html = `
                    <div class="topic-info">
                        <div class="info-row">
                            <span class="info-label">话题ID</span>
                            <span class="info-value">${topic.topic_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">标题</span>
                            <span class="info-value">${topic.title}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">状态</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Token计数</span>
                            <span class="info-value">${topic.token_count_since_summary}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">结束评分</span>
                            <span class="info-value">${topic.end_score.toFixed(2)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">LLM建议</span>
                            <span class="info-value">${topic.llm_suggestion || '无'}</span>
                        </div>
                    </div>
                `;

                if (topic.summary) {
                    html += `
                        <div class="summary-box">
                            <div class="summary-title">📝 话题摘要</div>
                            <div class="summary-content">${topic.summary}</div>
                        </div>
                    `;
                }

                if (topic.llm_hint) {
                    html += `
                        <div class="llm-hint">
                            <strong>💡 提示：</strong> ${topic.llm_hint}
                        </div>
                    `;
                }

                if (topic.closing_status) {
                    const cs = topic.closing_status;
                    html += `
                        <div class="closing-status">
                            <div class="summary-title">🔒 关闭状态</div>
                            <div style="margin-top: 10px;">
                                <div>Agent 1: ${cs.agent1_requested ? '✅ 已请求' : '⏳ 未请求'}</div>
                                <div>Agent 2: ${cs.agent2_requested ? '✅ 已请求' : '⏳ 未请求'}</div>
                                <div style="margin-top: 8px; color: #718096;">
                                    ${cs.both_agreed ? '双方已同意关闭' : '等待双方确认'}
                                </div>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('topicInfo').innerHTML = html;
            },

            renderMarkdown(text) {
                // 配置 marked 选项
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            try {
                                return hljs.highlight(code, { language: lang }).value;
                            } catch (err) {}
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
                
                return marked.parse(text);
            },

            renderMessages(messages) {
                if (messages.length === 0) {
                    document.getElementById('messagesContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💭</div>
                            <div>暂无消息</div>
                        </div>
                    `;
                    return;
                }

                const container = document.getElementById('messagesContainer');
                
                // 保存当前滚动位置
                const wasAtBottom = !this.userIsScrolling;
                const scrollPosition = container.scrollTop;

                const html = messages.map(msg => {
                    const agentClass = msg.agent_id.includes('agent-1') ? 'agent-1' : 'agent-2';
                    const agentName = msg.agent_name || msg.agent_id;
                    const time = new Date(msg.created_at).toLocaleString('zh-CN');

                    return `
                        <div class="message ${agentClass}">
                            <div class="message-header">
                                <span><strong>${this.escapeHtml(agentName)}</strong></span>
                                <span>${time}</span>
                            </div>
                            <div class="message-content">${this.renderMarkdown(msg.content)}</div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
                
                // 只在用户没有主动滚动时才自动滚动到底部
                if (wasAtBottom) {
                    container.scrollTop = container.scrollHeight;
                } else {
                    // 保持用户的滚动位置
                    container.scrollTop = scrollPosition;
                }
            },

            showError(message, type = 'error') {
                const container = document.getElementById('errorContainer');
                const className = type === 'success' ? 'llm-hint' : 'error';
                container.innerHTML = `<div class="${className}">${message}</div>`;
                setTimeout(() => {
                    container.innerHTML = '';
                }, 3000);
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            refresh() {
                this.loadData();
            },

            startAutoRefresh() {
                this.refreshInterval = setInterval(() => {
                    this.loadData();
                }, 5000); // 每5秒刷新一次
            },

            stopAutoRefresh() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                }
            }
        };

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

        // 页面卸载时停止自动刷新
        window.addEventListener('beforeunload', () => {
            app.stopAutoRefresh();
        });
    </script>
</body>
</html>
