<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时监控 - AI 双智能体对话平台</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 深色主题（默认） */
        :root {
            --bg-primary: #0A0E27;
            --bg-secondary: #0F172A;
            --bg-card: #1E293B;
            --accent-primary: #8B5CF6;
            --accent-secondary: #A78BFA;
            --accent-cyan: #06B6D4;
            --accent-green: #10B981;
            --accent-gold: #FBBF24;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #64748B;
            --border-color: #334155;
            --glow-purple: 0 0 20px rgba(139, 92, 246, 0.3);
            --navbar-bg: rgba(30, 41, 59, 0.8);
            --code-bg: rgba(139, 92, 246, 0.15);
        }

        /* 浅色主题 */
        [data-theme="light"] {
            --bg-primary: #F8FAFC;
            --bg-secondary: #F1F5F9;
            --bg-card: #FFFFFF;
            --accent-primary: #7C3AED;
            --accent-secondary: #8B5CF6;
            --accent-cyan: #0891B2;
            --accent-green: #059669;
            --accent-gold: #D97706;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --glow-purple: 0 0 20px rgba(124, 58, 237, 0.15);
            --navbar-bg: rgba(255, 255, 255, 0.8);
            --code-bg: rgba(124, 58, 237, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 24px;
        }

        .navbar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: var(--navbar-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--glow-purple);
            transition: all 0.3s ease;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
        }

        .status-live {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            border-radius: 24px;
            font-size: 14px;
            color: var(--accent-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .btn-theme {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            background: transparent;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-theme:hover {
            background: var(--bg-card);
            border-color: var(--accent-primary);
        }

        .btn-theme svg {
            width: 20px;
            height: 20px;
        }

        .main-content {
            margin-top: 100px;
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--glow-purple);
        }

        .card-header {
            padding: 20px 24px;
            background: rgba(139, 92, 246, 0.05);
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 24px;
        }

        .messages-container {
            height: 700px;
            overflow-y: auto;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .message {
            margin-bottom: 16px;
            padding: 16px;
            border-radius: 12px;
            border-left: 3px solid;
            transition: all 0.2s;
        }

        .message:hover {
            transform: translateX(4px);
        }

        .message.agent-1 {
            background: rgba(139, 92, 246, 0.1);
            border-left-color: var(--accent-primary);
        }

        .message.agent-2 {
            background: rgba(6, 182, 212, 0.1);
            border-left-color: var(--accent-cyan);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .message-agent {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .agent-1 .message-agent {
            color: var(--accent-secondary);
        }

        .agent-2 .message-agent {
            color: var(--accent-cyan);
        }

        .message-time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .message-content {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .message-content code {
            background: var(--code-bg);
            color: var(--accent-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
        }

        .message-footer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
        }

        .score-excellent {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .score-good {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
        }

        .score-fair {
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .score-poor {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid #EF4444;
        }

        .score-pending {
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
        }

        .evaluation-comment {
            color: var(--text-muted);
            font-style: italic;
            font-size: 12px;
        }

        .topic-description {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid var(--accent-cyan);
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }

        .topic-description-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .topic-description-content {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 14px;
        }

        .message-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            transition: all 0.3s ease;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .info-grid {
            display: grid;
            gap: 16px;
        }

        .info-item {
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .info-item:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-closing {
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
        }

        .status-closed {
            background: rgba(100, 116, 139, 0.15);
            color: var(--text-muted);
            border: 1px solid var(--text-muted);
        }

        .summary-box {
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid var(--accent-primary);
            padding: 20px;
            border-radius: 12px;
            margin-top: 16px;
        }

        .summary-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-content {
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .navbar {
                top: 10px;
                left: 10px;
                right: 10px;
            }

            .messages-container {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            实时监控
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn-theme" onclick="monitor.toggleTheme()" title="切换主题">
                <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <div class="status-live">
                <div class="status-dot"></div>
                <span>LIVE</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="main-content">
            <div class="card">
                <div class="card-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    对话消息流
                </div>
                <div class="card-body">
                    <div id="messagesContainer" class="messages-container">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                            </svg>
                            <div>正在加载...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    话题信息
                </div>
                <div class="card-body">
                    <div id="topicInfo">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                            </svg>
                            <div>正在加载...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const monitor = {
            apiUrl: '/api',
            currentTopicId: null,
            refreshInterval: null,
            userIsScrolling: false,

            init() {
                this.loadTheme();
                this.loadData();
                this.startAutoRefresh();
                this.setupScrollDetection();
            },

            loadTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                this.setTheme(savedTheme);
            },

            setTheme(theme) {
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.getElementById('theme-icon-sun').style.display = 'block';
                    document.getElementById('theme-icon-moon').style.display = 'none';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    document.getElementById('theme-icon-sun').style.display = 'none';
                    document.getElementById('theme-icon-moon').style.display = 'block';
                }
                localStorage.setItem('theme', theme);
            },

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                this.setTheme(newTheme);
            },

            setupScrollDetection() {
                const container = document.getElementById('messagesContainer');
                if (!container) return;

                container.addEventListener('scroll', () => {
                    const currentScroll = container.scrollTop;
                    const maxScroll = container.scrollHeight - container.clientHeight;
                    this.userIsScrolling = (maxScroll - currentScroll) > 50;
                });
            },

            async loadData() {
                try {
                    await this.loadTopic();
                    if (this.currentTopicId) {
                        await this.loadMessages();
                    }
                } catch (error) {
                    console.error('加载失败:', error);
                }
            },

            async loadTopic() {
                try {
                    const response = await fetch(`${this.apiUrl}/monitor/topic/active`);

                    if (!response.ok) {
                        if (response.status === 404) {
                            document.getElementById('topicInfo').innerHTML = `
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="15" y1="9" x2="9" y2="15"></line>
                                        <line x1="9" y1="9" x2="15" y2="15"></line>
                                    </svg>
                                    <div>暂无活跃话题</div>
                                </div>
                            `;
                            document.getElementById('messagesContainer').innerHTML = `
                                <div class="empty-state">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                    <div>暂无消息</div>
                                </div>
                            `;
                            this.currentTopicId = null;
                            return;
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const topic = await response.json();
                    this.currentTopicId = topic.topic_id;
                    this.displayTopic(topic);
                } catch (error) {
                    console.error('加载话题失败:', error);
                }
            },

            displayTopic(topic) {
                const statusClass = {
                    'active': 'status-active',
                    'closing_pending': 'status-closing',
                    'closed': 'status-closed'
                }[topic.status] || 'status-active';

                const statusText = {
                    'active': '进行中',
                    'closing_pending': '待关闭',
                    'closed': '已关闭'
                }[topic.status] || topic.status;

                let html = `
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">话题标题</div>
                            <div class="info-value">${this.escapeHtml(topic.title || '无标题')}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">状态</div>
                            <div class="info-value">
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Token 计数</div>
                            <div class="info-value">${topic.token_count_since_summary || 0}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">结束评分</div>
                            <div class="info-value">${topic.end_score ? topic.end_score.toFixed(1) : '0.0'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">LLM 建议</div>
                            <div class="info-value">${topic.llm_suggestion || '无'}</div>
                        </div>
                    </div>
                `;

                // 显示话题描述
                if (topic.topic_description) {
                    html += `
                        <div class="topic-description">
                            <div class="topic-description-title">📋 话题描述</div>
                            <div class="topic-description-content">${this.escapeHtml(topic.topic_description)}</div>
                        </div>
                    `;
                }

                // 显示话题总结
                if (topic.summary) {
                    html += `
                        <div class="summary-box">
                            <div class="summary-title">💡 话题总结</div>
                            <div class="summary-content">${this.escapeHtml(topic.summary)}</div>
                        </div>
                    `;
                }

                document.getElementById('topicInfo').innerHTML = html;
            },

            async loadMessages() {
                if (!this.currentTopicId) return;

                try {
                    const response = await fetch(
                        `${this.apiUrl}/monitor/topic/${this.currentTopicId}/messages?limit=100`
                    );

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    this.displayMessages(data.messages);
                } catch (error) {
                    console.error('加载消息失败:', error);
                }
            },

            renderMarkdown(text) {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            try {
                                return hljs.highlight(code, { language: lang }).value;
                            } catch (err) {}
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
                return marked.parse(text);
            },

            displayMessages(messages) {
                const container = document.getElementById('messagesContainer');
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <div>暂无消息</div>
                        </div>
                    `;
                    return;
                }

                const wasAtBottom = !this.userIsScrolling;

                const html = messages.map(msg => {
                    const agentClass = msg.agent_id === 'agent-1' ? 'agent-1' : 'agent-2';
                    const agentName = msg.agent_name || msg.agent_id;
                    const time = new Date(msg.created_at).toLocaleString('zh-CN');
                    
                    // 评分显示
                    let scoreHtml = '';
                    if (msg.relevance_score !== null && msg.relevance_score !== undefined) {
                        const score = msg.relevance_score;
                        let scoreClass = 'score-pending';
                        let scoreLabel = '待评分';
                        
                        if (score >= 80) {
                            scoreClass = 'score-excellent';
                            scoreLabel = '优秀';
                        } else if (score >= 60) {
                            scoreClass = 'score-good';
                            scoreLabel = '良好';
                        } else if (score >= 40) {
                            scoreClass = 'score-fair';
                            scoreLabel = '一般';
                        } else {
                            scoreClass = 'score-poor';
                            scoreLabel = '较差';
                        }
                        
                        scoreHtml = `
                            <div class="message-footer">
                                <span class="score-badge ${scoreClass}">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                    </svg>
                                    ${score.toFixed(1)} 分 · ${scoreLabel}
                                </span>
                                ${msg.evaluation_comment ? `<span class="evaluation-comment">${this.escapeHtml(msg.evaluation_comment)}</span>` : ''}
                            </div>
                        `;
                    } else {
                        scoreHtml = `
                            <div class="message-footer">
                                <span class="score-badge score-pending">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    评分中...
                                </span>
                            </div>
                        `;
                    }
                    
                    return `
                        <div class="message ${agentClass}">
                            <div class="message-header">
                                <span class="message-agent">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <circle cx="12" cy="12" r="10"></circle>
                                    </svg>
                                    ${this.escapeHtml(agentName)}
                                </span>
                                <span class="message-time">${time}</span>
                            </div>
                            <div class="message-content">${this.renderMarkdown(msg.content)}</div>
                            ${scoreHtml}
                        </div>
                    `;
                }).join('');

                container.innerHTML = html;
                
                if (wasAtBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            startAutoRefresh() {
                this.refreshInterval = setInterval(() => {
                    this.loadData();
                }, 5000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            monitor.init();
        });
    </script>
</body>
</html>
